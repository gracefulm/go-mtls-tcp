# Step04 — HAProxy 版の egress sidecar 設定。
# 平文 :9445 を受けて、上流 server:9444 に mTLS で繋ぎ直す。
#
# 提示するクライアント証明書 (= /tmp/client.pem) は compose の entrypoint で
# client.crt + client.key を連結したもの。HAProxy の `crt` ディレクティブは
# 「証明書 + 秘密鍵を連結した PEM」を 1 ファイルで要求する仕様 (Envoy のように
# certificate_chain と private_key を別ファイルで渡せない)。
#
# Envoy 設定 (../envoy/envoy.yaml) との対応:
#   listeners[].address.socket_address       -> frontend ... bind *:9445
#   tcp_proxy filter                         -> mode tcp
#   clusters[].load_assignment endpoint.address
#                                            -> server srv1 server:9444
#   UpstreamTlsContext.tls_certificates      -> server ... ssl crt /tmp/client.pem
#   UpstreamTlsContext.validation_context.trusted_ca
#                                            -> server ... ca-file /certs-ro/ca.crt verify required
#   UpstreamTlsContext.sni                   -> server ... sni str(localhost)
#   match_typed_subject_alt_names (DNS=localhost)
#                                            -> server ... verifyhost localhost

global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client  1m
    timeout server  1m

frontend plaintext_in
    bind *:9445
    default_backend mtls_upstream

backend mtls_upstream
    server srv1 server:9444 ssl crt /tmp/client.pem ca-file /certs-ro/ca.crt verify required sni str(localhost) verifyhost localhost
